[package]
name = "evo-agent-client"
version = "0.1.0"
description = "EvoAgent desktop shell"
authors = ["EvoAgent"]
edition = "2021"

[lib]
name = "evo_agent_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
